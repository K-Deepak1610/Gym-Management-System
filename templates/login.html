{% extends "base.html" %}

{% block title %}Login - Neon Gym Management{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[80vh]">
    <div class="w-full max-w-md p-10 glass-card rounded-3xl fade-in">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-6 neon-glow transform -rotate-6">
                <i class="fas fa-dumbbell text-4xl text-white"></i>
            </div>
            <h2 class="text-3xl font-bold mb-2">Welcome Back</h2>
            <p class="text-gray-400">Login to manage your fitness journey</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium mb-2 text-gray-300">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="username" required 
                        class="w-full pl-11 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-[#4ecdc4] focus:ring-1 focus:ring-[#4ecdc4] transition-all"
                        placeholder="Enter username">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium mb-2 text-gray-300">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="password" required 
                        class="w-full pl-11 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl focus:outline-none focus:border-[#4ecdc4] focus:ring-1 focus:ring-[#4ecdc4] transition-all"
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-4 btn-primary rounded-xl font-bold text-white shadow-lg shadow-cyan-500/20 transform hover:scale-[1.02] active:scale-[0.98]">
                PROCEED TO DASHBOARD
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-white/10 text-center">
            <p class="text-sm text-gray-500">Demo Credentials:</p>
            <div class="flex justify-center gap-4 mt-2 text-xs text-[#4ecdc4]">
                <span>Admin: admin/admin123</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
