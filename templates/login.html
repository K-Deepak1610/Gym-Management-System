<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraFit OS | Secure Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex items-center justify-center p-6 selection:bg-brand-500/30">

    <div class="w-full max-w-sm">
        <div class="mb-10 text-center">
            <div class="w-12 h-12 rounded-xl bg-white text-zinc-950 flex items-center justify-center font-bold text-xl mx-auto mb-4 shadow-xl shadow-brand-500/10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Welcome back</h1>
            <p class="text-sm text-zinc-500 mt-2">Sign in to your AuraFit workspace</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="mb-6 p-4 rounded-lg text-sm font-medium {% if category == 'error' %}bg-red-500/10 text-red-500 border border-red-500/20{% else %}bg-emerald-500/10 text-emerald-500 border border-emerald-500/20{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-2xl">
            <form action="{{ url_for('auth_bp.login') }}" method="POST" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-2">Workspace Email or Username</label>
                    <input type="text" name="username" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 focus:ring-brand-500/50 transition-all text-sm text-white" placeholder="admin">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-xs font-medium text-zinc-400">Password</label>
                        <a href="#" class="text-[10px] text-brand-500 hover:text-brand-400">Forgot?</a>
                    </div>
                    <input type="password" name="password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 outline-none focus:border-brand-500/50 focus:ring-1 focus:ring-brand-500/50 transition-all text-sm text-white" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-white text-zinc-900 font-semibold py-3 rounded-lg text-sm hover:bg-zinc-200 transition-colors active:scale-[0.98]">
                    Authenticate Securely
                </button>
            </form>
        </div>
        
        <p class="text-center text-xs text-zinc-600 mt-8">Protected by SynapseAuth Enterprise Security</p>
    </div>

</body>
</html>
